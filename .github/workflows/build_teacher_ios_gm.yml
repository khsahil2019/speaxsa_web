name: Build Teacher iOS with Official Xcode GM

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build_teacher_ios_gm.yml'

jobs:
  build:
    name: Build Native iOS XCArchive (Official Xcode 16 GM)
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Official Xcode 16 GM
        run: |
          echo "Available Xcode installations:"
          ls -ld /Applications/Xcode*.app
          XCODE_APP=$(ls -d /Applications/Xcode_16*.app /Applications/Xcode.app 2>/dev/null | head -n 1)
          echo "Using Xcode: $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> $GITHUB_ENV
          export DEVELOPER_DIR="$XCODE_APP/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd speaxa_teacher
          flutter pub get

      - name: Install CocoaPods
        run: |
          cd speaxa_teacher/ios
          pod install --repo-update

      - name: Build Flutter iOS App
        run: |
          cd speaxa_teacher
          flutter build ios --release --no-codesign

      - name: Archive Native iOS App
        run: |
          cd speaxa_teacher/ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$GITHUB_WORKSPACE/Runner.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Zip XCArchive
        run: |
          zip -r -y speaxa-teacher-build18.xcarchive.zip Runner.xcarchive

      - name: Upload Compiled XCArchive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: speaxa-teacher-build18-xcarchive
          path: speaxa-teacher-build18.xcarchive.zip
          retention-days: 7
