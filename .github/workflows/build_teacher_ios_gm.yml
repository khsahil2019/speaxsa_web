name: Build Teacher iOS with Official Xcode GM

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Native iOS XCArchive (Official Xcode 16.2 GM)
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Official Xcode 16.1 GM
        run: |
          sudo xcode-select -s /Applications/Xcode_16.1.app || sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -s /Applications/Xcode_16.app || true
          xcodebuild -version
          xcodebuild -showsdks

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd speaxa_teacher
          flutter pub get

      - name: Install CocoaPods
        run: |
          cd speaxa_teacher/ios
          pod install --repo-update

      - name: Build Native iOS Archive
        run: |
          cd speaxa_teacher
          flutter build ios --release --no-codesign
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$GITHUB_WORKSPACE/Runner.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Zip XCArchive
        run: |
          zip -r -y speaxa-teacher-build18.xcarchive.zip Runner.xcarchive

      - name: Upload Compiled XCArchive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: speaxa-teacher-build18-xcarchive
          path: speaxa-teacher-build18.xcarchive.zip
          retention-days: 5
