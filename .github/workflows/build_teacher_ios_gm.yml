name: Build Teacher iOS with Official Xcode GM

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build_teacher_ios_gm.yml'

jobs:
  build:
    name: Build Native iOS XCArchive (Official Xcode GM)
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 15.4 GM
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Verify Xcode Version
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies & Build Bundle
        run: |
          cd speaxa_teacher
          flutter pub get
          flutter build bundle

      - name: Install CocoaPods
        run: |
          cd speaxa_teacher/ios
          pod install --repo-update

      - name: Build Native iOS XCArchive
        run: |
          cd speaxa_teacher/ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$GITHUB_WORKSPACE/Runner.xcarchive" \
            DEVELOPMENT_TEAM=SJQWNCMBX9 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Zip XCArchive
        run: |
          zip -r -y speaxa-teacher-official-gm.xcarchive.zip Runner.xcarchive

      - name: Upload Compiled XCArchive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: speaxa-teacher-official-gm-xcarchive
          path: speaxa-teacher-official-gm.xcarchive.zip
          retention-days: 7

