name: Build Teacher iOS with Official Xcode GM

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Native iOS App (Official Xcode 16 GM)
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Official Xcode 16.2 GM
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s /Applications/Xcode_16.1.app || sudo xcode-select -s /Applications/Xcode_16.0.app || true
          xcodebuild -version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd speaxa_teacher
          flutter pub get

      - name: Install CocoaPods
        run: |
          cd speaxa_teacher/ios
          pod install --repo-update

      - name: Build Native iOS Bundle
        run: |
          cd speaxa_teacher
          flutter build ios --release --no-codesign

      - name: Upload Compiled App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: speaxa-teacher-compiled-app
          path: speaxa_teacher/build/ios/iphoneos/Runner.app
          retention-days: 5
