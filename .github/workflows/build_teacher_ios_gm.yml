name: Build Teacher iOS with Official Xcode GM

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build_teacher_ios_gm.yml'
      - 'speaxa_teacher/ios/**'
      - 'speaxa_teacher/pubspec.yaml'

jobs:
  build:
    name: Build Native iOS XCArchive (Official Xcode GM)
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 16.1 GM
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.1'

      - name: Verify Xcode Version
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build iOS Archive with Flutter
        run: |
          cd speaxa_teacher
          flutter pub get
          flutter build ipa --release --no-codesign

      - name: Zip XCArchive
        run: |
          cd speaxa_teacher
          if [ -d "build/ios/archive/Runner.xcarchive" ]; then
            zip -r -y ../speaxa-teacher-official-gm.xcarchive.zip build/ios/archive/Runner.xcarchive
          elif [ -d "build/ios/iphoneos/Runner.app" ]; then
            zip -r -y ../speaxa-teacher-official-gm.app.zip build/ios/iphoneos/Runner.app
          fi

      - name: Upload Compiled Artifact
        uses: actions/upload-artifact@v4
        with:
          name: speaxa-teacher-official-gm-xcarchive
          path: speaxa-teacher-official-gm.*.zip
          retention-days: 7
