name: Deploy Teacher iOS to App Store Connect

on:
  workflow_dispatch:

jobs:
  upload:
    name: Upload to App Store Connect
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify IPA and Secrets
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          if [ -z "$APPLE_ID" ]; then
            echo "::error::APPLE_ID secret is MISSING in GitHub! Please add it in Repo Settings -> Secrets -> Actions"
            exit 1
          fi
          if [ -z "$APPLE_PASSWORD" ]; then
            echo "::error::APPLE_PASSWORD secret is MISSING in GitHub! Please add it in Repo Settings -> Secrets -> Actions"
            exit 1
          fi
          echo "Checking file..."
          ls -lh ios_builds/speaxsa_teacher.ipa

      - name: Upload IPA to App Store Connect
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          echo "Starting upload to App Store Connect..."
          xcrun altool --upload-app \
            -f "ios_builds/speaxsa_teacher.ipa" \
            -t ios \
            -u "$APPLE_ID" \
            -p "$APPLE_PASSWORD" \
            --verbose
          echo "Upload complete!"
