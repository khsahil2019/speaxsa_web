name: Deploy Teacher iOS to App Store Connect

on:
  workflow_dispatch:

jobs:
  upload:
    name: Upload to App Store Connect
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Clean and Validate Credentials
        env:
          RAW_APPLE_ID: ${{ secrets.APPLE_ID }}
          RAW_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          CLEAN_ID=$(echo -n "$RAW_APPLE_ID" | tr -d '\r\n ' | xargs)
          CLEAN_PASS=$(echo -n "$RAW_APPLE_PASSWORD" | tr -d '\r\n ' | xargs)
          
          if [ -z "$CLEAN_ID" ]; then
            echo "::error::APPLE_ID secret is empty!"
            exit 1
          fi
          if [ -z "$CLEAN_PASS" ]; then
            echo "::error::APPLE_PASSWORD secret is empty!"
            exit 1
          fi
          
          echo "CLEAN_APPLE_ID=$CLEAN_ID" >> $GITHUB_ENV
          echo "CLEAN_APPLE_PASSWORD=$CLEAN_PASS" >> $GITHUB_ENV
          echo "Credentials sanitized successfully (Password length: ${#CLEAN_PASS})"

      - name: Upload IPA to App Store Connect
        run: |
          echo "Starting upload to App Store Connect via altool..."
          xcrun altool --upload-app \
            -f "ios_builds/speaxsa_teacher.ipa" \
            -t ios \
            -u "$CLEAN_APPLE_ID" \
            -p "$CLEAN_APPLE_PASSWORD" \
            --verbose
          echo "🎉 Upload process completed successfully!"
